<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#6b1d5c" />
  <meta name="description" content="Gestion prépayée de la buvette ETH" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>Buvette ETH</title>
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <main id="loginView" class="centered">
    <form id="loginForm" class="card login-card">
      <div class="brand">ETH</div>
      <h1>Buvette ETH</h1>
      <p class="muted">Connexion du staff</p>
      <label>Adresse e-mail<input id="email" type="email" autocomplete="username" required /></label>
      <label>Mot de passe<input id="password" type="password" autocomplete="current-password" required /></label>
      <button class="primary" type="submit">Se connecter</button>
      <p id="loginError" class="error"></p>
    </form>
  </main>

  <div id="appView" class="hidden app-shell">
    <header>
     <div><strong>Buvette ETH</strong><small id="userLabel" class="hidden"></small></div>
      <button id="logoutBtn" class="ghost">Déconnexion</button>
    </header>

    <nav aria-label="Navigation">
      <button data-tab="sale" class="active">Vente</button>
      <button data-tab="members">Adhérents</button>
      <button data-tab="history">Historique</button>
      <button data-tab="admin" id="adminTabBtn" class="hidden">Admin</button>
    </nav>

    <section id="saleTab" class="tab active">
      <div class="customer-panel card">
        <label for="customerSearch">Adhérent</label>
        <div class="search-row"><input id="customerSearch" placeholder="Nom de l’adhérent" autocomplete="off"/><button id="clearCustomer" class="ghost">Effacer</button></div>
        <div id="customerResults" class="results"></div>
        <div id="selectedCustomer" class="selected hidden">
          <div><strong id="selectedName"></strong><small id="selectedNumber"></small></div>
          <div class="balance"><span>Solde</span><strong id="selectedBalance">0,00 €</strong></div>
        </div>
      </div>
      <div id="products" class="product-grid"></div>
      <p id="selectHint" class="empty">Sélectionnez d’abord un adhérent.</p>
    </section>

    <section id="membersTab" class="tab">
      <div class="split">
       <form id="memberForm" class="card">
  <h2>Nouvel adhérent</h2>
  <label>Pseudo<input id="memberName" required maxlength="100" /></label>
  <button class="primary" type="submit">Ajouter</button>
</form>
        <form id="creditForm" class="card">
          <h2>Créditer un compte</h2>
          <label>Adhérent<select id="creditCustomer" required></select></label>
          <label>Montant (€)<input id="creditAmount" type="number" min="0.01" step="0.01" required /></label>
         <label>Moyen de paiement<select id="paymentMethod"><option value="cash">Espèces</option><option value="cheque">Chèque</option><option value="virement">Virement</option></select></label>
          <label id="chequeRefLabel" class="hidden">Référence du chèque<input id="chequeRef" maxlength="80" /></label>
          <button class="primary" type="submit">Créditer</button>
        </form>
      </div>
      <div class="card"><h2>Adhérents</h2><div id="memberList" class="table-wrap"></div></div>
    </section>

    <section id="historyTab" class="tab">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Dernières opérations</h2>
      <button id="exportHistoryBtn" class="primary">Exporter en Excel</button>
    </div>
    <div id="historyList" class="table-wrap"></div>
  </div>
</section>

    <section id="adminTab" class="tab">
      <div class="split">
        <form id="productForm" class="card">
          <h2>Ajouter un produit</h2>
          <input id="productId" type="hidden" />
          <label>Nom<input id="productName" required maxlength="60" /></label>
          <label>Prix (€)<input id="productPrice" type="number" min="0.01" step="0.01" required /></label>
          <label>Couleur<input id="productColor" type="color" value="#6b1d5c" /></label>
          <button class="primary" type="submit">Enregistrer</button>
          <button id="cancelProductEdit" class="ghost hidden" type="button">Annuler la modification</button>
        </form>
        <div class="card"><h2>Catalogue</h2><div id="adminProducts"></div></div>
      </div>
    </section>
  </div>

  <div id="undoBar" class="undo hidden"><span id="undoText"></span><button id="undoBtn">Annuler</button></div>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
